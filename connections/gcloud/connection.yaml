# Google Cloud through the gcloud CLI (docs/connections.md).
# The key stays in control: before each turn control mints a one-hour access token
# from it (exchange: google-access-token), and only that token, as the field
# `token`, reaches the computer. gcloud reads it from its file through
# CLOUDSDK_AUTH_ACCESS_TOKEN_FILE, and keeps its config under CLOUDSDK_CONFIG, in
# the turn's folder. Reads are the list/describe/get commands of the health
# recipes in SKILL.md; global flags before the command group make it ask.
title: Google Cloud
description: Cloud Run, GKE, Monitoring and Logging health through the gcloud CLI, with a one-hour token.
cli: gcloud
setup:
  - "In the Google Cloud console, open [Service accounts](https://console.cloud.google.com/iam-admin/serviceaccounts) in your project and click Create service account."
  - "Grant it the Viewer role (roles/viewer). For less access, grant only roles/run.viewer, roles/container.viewer, roles/monitoring.viewer, roles/logging.viewer, roles/compute.viewer and roles/browser."
  - "Open the new service account, then Keys, Add key, Create new key, JSON, Create. The key file downloads."
  - "Open the file in a text editor, copy all of it and paste it below. Delete the file afterwards."
  - "If your organization blocks key downloads, paste the authorized_user JSON that gcloud auth application-default login writes instead. It acts as you, with all your access."
withoutAsking: "List and describe projects, Cloud Run services, GKE clusters, Monitoring alerts, policies and uptime checks, regions and zones, and read logs."
asksFirst: "Deploy, update, create, delete, ssh and everything else, and any command with a flag before its command group."
fields:
  key:
    label: "Service account key JSON"
    placeholder: '{"type": "service_account", "project_id": "my-project", ...}'
    secret: true
    help: "The whole key file from step 3, or an authorized_user JSON (step 5). It stays in Chiefbot's control server: each turn gets only a one-hour token made from it."
  project:
    label: "Default project ID"
    placeholder: "my-project-123456"
    help: "The project ID, not its name: the console's project picker shows both. The bot can name another per command."
exchange: google-access-token
env:
  CLOUDSDK_AUTH_ACCESS_TOKEN_FILE: "{dir}/token"
  CLOUDSDK_CORE_PROJECT: "{project}"
  CLOUDSDK_CONFIG: "{dir}/config"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK: "1"
readOnly:
  - "gcloud --version"
  - "gcloud version*"
  - "gcloud * --help"
  - "gcloud config list*"
  - "gcloud projects list*"
  - "gcloud projects describe *"
  - "gcloud run services list*"
  - "gcloud run services describe *"
  - "gcloud run revisions list*"
  - "gcloud run revisions describe *"
  - "gcloud container clusters list*"
  - "gcloud container clusters describe *"
  - "gcloud container node-pools list*"
  - "gcloud container node-pools describe *"
  - "gcloud container operations list*"
  - "gcloud monitoring alerts list*"
  - "gcloud monitoring alerts describe *"
  - "gcloud monitoring policies list*"
  - "gcloud monitoring policies describe *"
  - "gcloud monitoring uptime list-configs*"
  - "gcloud monitoring uptime describe *"
  - "gcloud logging read *"
  - "gcloud compute regions list*"
  - "gcloud compute regions describe *"
  - "gcloud compute zones list*"
  - "gcloud compute zones describe *"
