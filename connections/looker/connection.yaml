# Looker through its API 4.0 (docs/connections.md). No official CLI fits, so the
# folder ships one: looker.ts, a small client that signs in with the API client ID
# and secret (POST /api/4.0/login) and makes one request per run. It reads them
# from the variables the Looker SDKs use and writes nothing to disk.
# The reads the globs below let run have their own commands, and looker.ts checks
# each can do no more: get takes only a list of paths that never run a query (a
# query run can build derived tables in the database), activity only System
# Activity queries, test-connection only that test. `looker request` (any method,
# path and body) always asks.
title: Looker
description: Looker queries, schedules and database connections through its API, as you.
cli: looker
setup:
  - "Ask a Looker admin for a user whose role grants only access_data, see_looks, see_user_dashboards, see_lookml_dashboards, see_schedules, see_system_activity, see_users and see_queries, plus see_admin if the bot should check database connections."
  - "Looker (original). The admin opens Admin, Users, edits that user and clicks Edit Keys to create an API key ([API authentication](https://docs.cloud.google.com/looker/docs/api-auth))."
  - "Looker (Google Cloud core). The admin turns on API keys for that user. Signed in as that user, open your Account page. Under API Keys, click Manage, then Create New API Key."
  - "Copy the client ID and the client secret of the new key."
withoutAsking: "Read the instance, users, connections, schedules, dashboards, Looks, models and folders, run System Activity queries and test database connections."
asksFirst: "Run a Look or a query on your own models, any other read, and every change."
fields:
  url:
    label: "Instance URL"
    placeholder: "https://mycompany.cloud.looker.com"
    help: "Only https:// and the host, no path. Add a port such as :19999 only if your admin says the API uses one."
  clientid:
    label: "API client ID"
    placeholder: "AbCdEf1234567890GhIj"
    help: "From step 4."
  secret:
    label: "API client secret"
    placeholder: "aBcD1234eFgH5678iJkL9012"
    secret: true
    help: "From step 4. It acts as that user, so the user's role decides what your bots can read."
env:
  LOOKERSDK_BASE_URL: "{url}"
  LOOKERSDK_CLIENT_ID: "{clientid}"
  LOOKERSDK_CLIENT_SECRET: "{secret}"
readOnly:
  - "looker --help"
  - "looker get *"
  - "looker activity *"
  - "looker test-connection *"
