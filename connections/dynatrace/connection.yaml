# Dynatrace through dtctl (github.com/dynatrace-oss/dtctl; docs/connections.md).
# dtctl takes a platform token only from a config file's context, so install.sh
# writes one to /etc/dtctl/config.yaml whose URL and token are ${DT_ENVIRONMENT_URL}
# and ${DT_API_TOKEN}: dtctl fills them from its environment when it loads a file
# named by DTCTL_CONFIG. The file is root's, so the agent cannot repoint it.
# DTCTL_TOKEN_STORAGE=file keeps dtctl off any OS keyring. HOME, DTCTL_SPILL_DIR
# and XDG_CACHE_HOME in the turn's folder (set after any the command brings) take
# its query spills and usage ledger with the turn.
# guard.sh, installed in front of dtctl, refuses --config (another config could
# send the token elsewhere) and --spill-to (a write outside the turn's folder),
# which the read-only globs below cannot tell apart, and a bare -- (after it,
# --help is an argument, and `dtctl apply -f x -- --help` would apply).
title: Dynatrace
description: Dynatrace problems, logs, services and SLOs through dtctl, as you.
cli: dtctl
setup:
  - "Open [Platform tokens](https://myaccount.dynatrace.com/platformTokens) in Dynatrace Account Management and click Platform token to create one."
  - "Name it, pick an expiration date, and limit it to the environment your bots read."
  - "Select only these scopes: storage:buckets:read, storage:events:read, storage:logs:read, storage:metrics:read, slo:slos:read, slo:objective-templates:read."
  - "Click Generate and copy the token. Dynatrace shows it once."
  - "The token never does more than your own Dynatrace permissions allow. dtctl's [token scopes](https://github.com/dynatrace-oss/dtctl/blob/main/docs/TOKEN_SCOPES.md) list what other reads need."
withoutAsking: "Read problems, logs, metrics, services and SLOs with get, describe, query, logs and the like."
asksFirst: "Apply, create, edit or delete anything, and every exec, such as an SLO evaluation, a workflow or CoPilot."
fields:
  environment:
    label: "Environment URL"
    placeholder: "https://abc12345.apps.dynatrace.com"
    help: "Your environment's address, as the browser shows it when Dynatrace is open, without a path."
  token:
    label: "Platform token"
    placeholder: "dt0s16.ABCDEFGH...."
    secret: true
    help: "The token from step 4, with only the scopes in step 3 and an expiration date."
env:
  DT_ENVIRONMENT_URL: "{environment}"
  DT_API_TOKEN: "{token}"
  DTCTL_CONFIG: "/etc/dtctl/config.yaml"
  DTCTL_TOKEN_STORAGE: "file"
  HOME: "{dir}"
  DTCTL_SPILL_DIR: "{dir}/spill"
  XDG_CACHE_HOME: "{dir}/cache"
readOnly:
  - "dtctl version*"
  - "dtctl --help"
  - "dtctl doctor*"
  - "dtctl commands*"
  - "dtctl auth status*"
  - "dtctl get *"
  - "dtctl describe *"
  - "dtctl query *"
  - "dtctl verify *"
  - "dtctl logs *"
  - "dtctl history *"
  - "dtctl inspect *"
